# aurality · configuración de Netlify (no hace falta tocarla)
[build]
  publish = "web"     # se publica solo la carpeta web/ (fuente/ es el código de origen, no se sirve)
  command = ""

# contenido siempre fresco, para que lo que se guarda en el panel se vea al momento
[[headers]]
  for = "/contenido/*"
  [headers.values]
    Cache-Control = "no-cache"

# el panel privado no aparece en buscadores
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# imágenes con caché larga
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/senal/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
